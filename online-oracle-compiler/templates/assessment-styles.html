<script>
(() => {
  function sync(form) {
    const classes = form.querySelector('[name="class_sections"]');
    const lab = form.querySelector('[name="lab"]');
    if (classes && lab) {
      const selected = [...classes.selectedOptions].map(option => option.value);
      for (const option of lab.options) {
        if (!option.value) continue;
        option.hidden = option.disabled = selected.length !== 1 || option.dataset.class !== selected[0];
      }
      if (lab.selectedOptions[0]?.disabled) lab.value = '';
    }
    const frequency = form.querySelector('[name="frequency"]');
    if (!frequency) return;
    for (const name of ['opens', 'closes', 'weekdays']) {
      const fields = form.querySelectorAll('[name="' + name + '"]');
      const enabled = name === 'weekdays' ? frequency.value === 'weekly' : frequency.value !== 'anytime';
      fields.forEach(field => {
        field.disabled = !enabled;
        if (name !== 'weekdays') field.required = enabled;
        const wrapper = field.closest('.assessment-map-field');
        if (wrapper) wrapper.hidden = !enabled;
      });
    }
  }
  document.addEventListener('DOMContentLoaded', () => document.querySelectorAll('.assessment-map-form').forEach(sync));
  document.addEventListener('change', event => {
    const form = event.target.closest('.assessment-map-form');
    if (form) sync(form);
  });
})();
</script>
